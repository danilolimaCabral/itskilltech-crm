<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📞 Telefone — CRM getLOG</title>
  <link rel="stylesheet" href="phone.min.css">
  <link rel="stylesheet" href="phone.dark.css" id="phone-theme">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0f172a; font-family: 'Inter', -apple-system, sans-serif; }

    #top-bar {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    #top-bar a { color: #94a3b8; text-decoration: none; font-size: 13px; }
    #top-bar a:hover { color: #fff; }
    #top-bar .title { color: #fff; font-size: 14px; font-weight: 600; flex: 1; }

    #status-bar {
      background: #0f172a;
      padding: 8px 16px;
      font-size: 12px;
      color: #64748b;
      border-bottom: 1px solid #1e293b;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .status-dot {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; background: #ef4444; flex-shrink: 0;
    }
    .status-dot.connected { background: #22c55e; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    /* Painel de gravação ativa */
    #recording-panel {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 10px 16px;
      display: none;
      align-items: center;
      gap: 10px;
    }
    #recording-panel.active { display: flex; }
    .rec-dot { width: 10px; height: 10px; border-radius: 50%; background: #ef4444; animation: blink 1s infinite; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .rec-label { color: #fca5a5; font-size: 12px; font-weight: 600; }
    .rec-timer { color: #94a3b8; font-size: 12px; font-family: monospace; }

    /* Seletor de lead */
    #lead-selector {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    #lead-selector label { color: #94a3b8; font-size: 12px; white-space: nowrap; }
    #lead-select {
      flex: 1; background: #0f172a; border: 1px solid #334155;
      color: #e2e8f0; font-size: 12px; padding: 4px 8px; border-radius: 6px;
    }

    /* Painel de transcrição */
    #transcription-panel {
      background: #0f172a; border: 1px solid #1e293b;
      margin: 12px 16px; border-radius: 10px; overflow: hidden; display: none;
    }
    #transcription-panel.visible { display: block; }
    #transcription-header {
      background: #1e293b; padding: 10px 14px;
      display: flex; align-items: center; justify-content: space-between;
    }
    #transcription-header h3 { color: #e2e8f0; font-size: 13px; margin: 0; }
    #transcription-status { font-size: 11px; color: #64748b; }
    #transcription-body { padding: 14px; }
    #transcription-text { color: #cbd5e1; font-size: 13px; line-height: 1.6; white-space: pre-wrap; min-height: 60px; }
    #transcription-text.loading { color: #64748b; font-style: italic; }
    #transcription-actions {
      padding: 10px 14px; border-top: 1px solid #1e293b;
      display: flex; gap: 8px; flex-wrap: wrap;
    }
    .btn-action { padding: 6px 14px; border-radius: 6px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; }
    .btn-save { background: #16a34a; color: #fff; }
    .btn-copy { background: #334155; color: #e2e8f0; }
    .btn-discard { background: transparent; color: #64748b; border: 1px solid #334155; }

    /* Toast */
    #toast {
      position: fixed; bottom: 20px; right: 20px;
      background: #16a34a; color: #fff;
      padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 600;
      box-shadow: 0 4px 20px rgba(0,0,0,.4);
      transform: translateY(80px); opacity: 0; transition: all .3s; z-index: 9999;
    }
    #toast.show { transform: translateY(0); opacity: 1; }
    #toast.error { background: #dc2626; }
  </style>

  <!-- ⚠️ IMPORTANTE: phoneOptions DEVE ser definido ANTES de carregar phone.min.js -->
  <script>
    // Configuração SIP — BrDid / OpenSIPS
    // Porta 5060 confirmada com 200 OK em teste de autenticação SIP Digest
    window.phoneOptions = {
      // Servidor WebSocket (transporte do browser)
      wssServer:        "voz.sobreip.com.br",
      WebSocketPort:    "8089",
      ServerPath:       "/ws",
      // Credenciais SIP (autenticação na porta 5060)
      SipDomain:        "voz.sobreip.com.br",
      SipUsername:      "4137988945",
      SipPassword:      "11jlr",
      profileName:      "Danilo Cabral",
      profileUser:      "4137988945",
      // UI
      welcomeScreen:    false,
      WelcomeScreen:    false,
      // Áudio
      AutoGainControl:  true,
      NoiseSuppression: true,
      EchoCancellation: true,
    };

    // Também salvar no localStorage como fallback
    const cfg = window.phoneOptions;
    Object.entries(cfg).forEach(([k, v]) => {
      try { localStorage.setItem(k, String(v)); } catch(e) {}
    });
    // Aceitar tela de boas-vindas automaticamente
    try { localStorage.setItem('WelcomeScreenAccept', 'true'); } catch(e) {}
  </script>
</head>
<body>

<!-- Barra superior -->
<div id="top-bar">
  <a href="/">← Voltar ao CRM</a>
  <span style="color:#334155">|</span>
  <span class="title">📞 Softphone — BrDid (41) 3798-8945</span>
  <span style="font-size:11px;color:#475569;">OpenSIPS · porta 5060</span>
</div>

<!-- Status de conexão -->
<div id="status-bar">
  <span class="status-dot" id="conn-dot"></span>
  <span id="conn-status">Inicializando softphone...</span>
</div>

<!-- Seletor de lead -->
<div id="lead-selector">
  <label>🎯 Lead:</label>
  <select id="lead-select">
    <option value="">— Selecionar lead para salvar transcrição —</option>
  </select>
</div>

<!-- Painel de gravação ativa -->
<div id="recording-panel">
  <span class="rec-dot"></span>
  <span class="rec-label">● GRAVANDO</span>
  <span class="rec-timer" id="rec-timer">00:00</span>
  <span style="color:#64748b;font-size:11px;">· máx. 2 canais simultâneos</span>
</div>

<!-- Container do softphone (Browser-Phone renderiza aqui) -->
<div id="phone-container"></div>

<!-- Painel de transcrição -->
<div id="transcription-panel">
  <div id="transcription-header">
    <h3>🎙️ Transcrição da Ligação</h3>
    <span id="transcription-status">Processando...</span>
  </div>
  <div id="transcription-body">
    <div id="transcription-text" class="loading">Transcrevendo áudio com IA (Whisper)...</div>
  </div>
  <div id="transcription-actions">
    <button class="btn-action btn-save" onclick="saveTranscription()">💾 Salvar na Timeline do Lead</button>
    <button class="btn-action btn-copy" onclick="copyTranscription()">📋 Copiar</button>
    <button class="btn-action btn-discard" onclick="discardTranscription()">✕ Descartar</button>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<!-- jQuery (necessário pelo Browser-Phone) -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<!-- SIP.js -->
<script src="https://cdn.jsdelivr.net/npm/sip.js@0.21.2/lib/platform/web/simple-user/simple-user.min.js"></script>
<!-- Browser-Phone (carregado DEPOIS do phoneOptions) -->
<script src="phone.min.js"></script>

<script>
// ============================================================
// GRAVAÇÃO DE ÁUDIO
// ============================================================
let mediaRecorder = null;
let audioChunks = [];
let recTimerInterval = null;
let recSeconds = 0;
let lastAudioBlob = null;
let currentCallId = null;

function startRecording(stream) {
  try {
    audioChunks = [];
    recSeconds = 0;
    const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus')
      ? 'audio/webm;codecs=opus'
      : 'audio/webm';
    mediaRecorder = new MediaRecorder(stream, { mimeType });

    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = () => {
      lastAudioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      clearInterval(recTimerInterval);
      document.getElementById('recording-panel').classList.remove('active');
      transcribeAudio(lastAudioBlob);
    };

    mediaRecorder.start(1000);
    document.getElementById('recording-panel').classList.add('active');

    recTimerInterval = setInterval(() => {
      recSeconds++;
      const m = String(Math.floor(recSeconds / 60)).padStart(2, '0');
      const s = String(recSeconds % 60).padStart(2, '0');
      document.getElementById('rec-timer').textContent = `${m}:${s}`;
    }, 1000);
  } catch (err) {
    console.error('[Gravação] Erro:', err);
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  }
}

// ============================================================
// TRANSCRIÇÃO VIA WHISPER
// ============================================================
async function transcribeAudio(blob) {
  const panel = document.getElementById('transcription-panel');
  const textEl = document.getElementById('transcription-text');
  const statusEl = document.getElementById('transcription-status');

  panel.classList.add('visible');
  textEl.className = 'loading';
  textEl.textContent = 'Transcrevendo áudio com IA (Whisper)...';
  statusEl.textContent = 'Processando...';

  try {
    const formData = new FormData();
    formData.append('audio', blob, 'ligacao.webm');
    formData.append('workspace', 'lottus');

    const res = await fetch('/api/transcribe-call', { method: 'POST', body: formData });
    const data = await res.json();

    if (data.text) {
      textEl.className = '';
      textEl.textContent = data.text;
      statusEl.textContent = `✅ Concluída · ${data.duration || ''}`;
    } else {
      textEl.className = '';
      textEl.textContent = data.error || 'Não foi possível transcrever.';
      statusEl.textContent = '⚠️ Erro';
    }
  } catch (err) {
    textEl.className = '';
    textEl.textContent = 'Erro: ' + err.message;
    statusEl.textContent = '❌ Erro';
  }
}

// ============================================================
// SALVAR TRANSCRIÇÃO NA TIMELINE
// ============================================================
async function saveTranscription() {
  const leadId = document.getElementById('lead-select').value;
  const text = document.getElementById('transcription-text').textContent;

  if (!leadId) { showToast('⚠️ Selecione um lead antes de salvar', 'error'); return; }
  if (!text || text.includes('Transcrevendo') || text.includes('Erro')) {
    showToast('⚠️ Aguarde a transcrição ser concluída', 'error'); return;
  }

  try {
    const res = await fetch('/api/save-call-transcription', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        leadId, workspace: 'lottus', transcription: text,
        duration: document.getElementById('rec-timer').textContent,
        callId: currentCallId || `call-${Date.now()}`
      })
    });
    const data = await res.json();
    if (data.ok) { showToast('✅ Transcrição salva na timeline!'); discardTranscription(); }
    else showToast('❌ Erro: ' + (data.error || ''), 'error');
  } catch (err) { showToast('❌ ' + err.message, 'error'); }
}

function copyTranscription() {
  navigator.clipboard.writeText(document.getElementById('transcription-text').textContent)
    .then(() => showToast('📋 Copiado!'));
}

function discardTranscription() {
  document.getElementById('transcription-panel').classList.remove('visible');
  lastAudioBlob = null;
}

// ============================================================
// CARREGAR LEADS
// ============================================================
async function loadLeads() {
  try {
    const res = await fetch('/api/leads?workspace=lottus');
    const data = await res.json();
    const sel = document.getElementById('lead-select');
    (data.leads || [])
      .sort((a, b) => (a.name || '').localeCompare(b.name || ''))
      .forEach(lead => {
        const opt = document.createElement('option');
        opt.value = lead.id;
        opt.textContent = `${lead.name || '(sem nome)'} — ${lead.company || ''}`;
        sel.appendChild(opt);
      });
  } catch (e) { console.warn('Leads não carregados:', e); }
}

// ============================================================
// MONITORAR STATUS SIP
// ============================================================
window.addEventListener('message', function(e) {
  if (!e.data) return;
  const t = e.data.type || '';
  if (t === 'sip-connected' || t === 'phone-connected') {
    document.getElementById('conn-dot').classList.add('connected');
    document.getElementById('conn-status').textContent = '✅ Conectado — ramal 4137988945 · porta 5060';
  }
  if (t === 'sip-disconnected' || t === 'phone-disconnected') {
    document.getElementById('conn-dot').classList.remove('connected');
    document.getElementById('conn-status').textContent = 'Desconectado';
    stopRecording();
  }
  if (t === 'call-answered' || t === 'call-started') {
    currentCallId = e.data.callId || `call-${Date.now()}`;
    if (e.data.stream) startRecording(e.data.stream);
    else navigator.mediaDevices.getUserMedia({ audio: true })
      .then(s => startRecording(s)).catch(err => console.warn('[Gravação]', err));
  }
  if (t === 'call-ended' || t === 'call-hangup') stopRecording();
});

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  loadLeads();

  // Ler parâmetros da URL: ?call=NUMERO&lead=ID&name=NOME
  const params = new URLSearchParams(window.location.search);
  const callNumber = params.get('call');
  const leadId = params.get('lead');
  const leadName = params.get('name');

  // Pré-selecionar o lead no dropdown se vier da URL
  if (leadId) {
    // Aguardar os leads carregarem e selecionar
    setTimeout(() => {
      const sel = document.getElementById('lead-select');
      if (sel) sel.value = leadId;
    }, 1500);
  }

  // Mostrar número sendo discado na barra de status
  if (callNumber) {
    const statusEl = document.getElementById('conn-status');
    statusEl.textContent = `📞 Discando para ${leadName || callNumber}...`;

    // Aguardar o Browser-Phone carregar e então discar
    let attempts = 0;
    const tryDial = setInterval(() => {
      attempts++;
      // Browser-Phone expõe DialByLine ou MakeCall globalmente
      if (typeof MakeCall === 'function') {
        clearInterval(tryDial);
        try {
          MakeCall(callNumber);
          statusEl.textContent = `📞 Ligando para ${leadName || callNumber}...`;
        } catch(e) {
          console.warn('[AutoDial] Erro ao discar:', e);
          // Fallback: preencher o campo de número e clicar em discar
          autoFillDialer(callNumber);
        }
      } else if (typeof DialByLine === 'function') {
        clearInterval(tryDial);
        try {
          DialByLine('1', callNumber);
          statusEl.textContent = `📞 Ligando para ${leadName || callNumber}...`;
        } catch(e) {
          autoFillDialer(callNumber);
        }
      } else if (attempts > 30) {
        // Timeout: preencher o campo manualmente
        clearInterval(tryDial);
        autoFillDialer(callNumber);
      }
    }, 500);
  } else {
    // Atualizar status após 2s
    setTimeout(() => {
      const statusEl = document.getElementById('conn-status');
      if (statusEl.textContent === 'Inicializando softphone...') {
        statusEl.textContent = 'Aguardando conexão SIP...';
      }
    }, 2000);
  }
});

// Preencher o campo de discagem do Browser-Phone manualmente
function autoFillDialer(number) {
  // Tentar preencher o input de número do Browser-Phone
  const inputs = document.querySelectorAll('input[type="tel"], input[placeholder*="number"], input[placeholder*="Number"], #dialNumber, .dialNumber');
  inputs.forEach(inp => {
    inp.value = number;
    inp.dispatchEvent(new Event('input', { bubbles: true }));
    inp.dispatchEvent(new Event('change', { bubbles: true }));
  });
  // Mostrar número na barra de status
  const statusEl = document.getElementById('conn-status');
  if (statusEl) statusEl.textContent = `📞 Pronto para discar: ${number} — pressione Ligar`;
}

// ============================================================
// TOAST
// ============================================================
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = type === 'error' ? 'error show' : 'show';
  setTimeout(() => { t.className = ''; }, 3500);
}
</script>

</body>
</html>
